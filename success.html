<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're all set — EarnMore</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .badge {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(0, 212, 170, 0.15);
    border: 1px solid rgba(0, 212, 170, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #00d4aa;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 10px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 28px;
  }
  button {
    background: rgba(0, 212, 170, 0.15);
    border: 1px solid rgba(0, 212, 170, 0.4);
    color: #00d4aa;
    font-size: 14px;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover {
    background: rgba(0, 212, 170, 0.25);
  }
  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">✓</div>
    <h1>You're all set</h1>
    <p>Premium is now active on your account. Cross-device sync, bonus-offer tracking, spend-cap accuracy, and your full rewards history are ready — just log back into EarnMore on any device to see them.</p>
    <button onclick="window.close()">Close this tab</button>
    <p class="hint">If this tab doesn't close automatically, it's safe to close manually.</p>
  </div>
</body>
</html>
