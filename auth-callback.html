<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in — EarnMore</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid rgba(0, 212, 170, 0.2);
    border-top-color: #00d4aa;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { font-size: 14px; line-height: 1.5; color: rgba(255, 255, 255, 0.6); }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 id="heading">Signing you in…</h1>
    <p id="message">This tab will close automatically once the extension picks up your sign-in. If it doesn't close within a few seconds, it's safe to close it yourself and return to the extension.</p>
  </div>
  <script>
    // The extension's background script reads the access_token directly out of this page's URL
    // (via a tabs.onUpdated listener matching this exact URL, watching for the #access_token=
    // fragment) — nothing on this page hands anything off manually. This page only exists to
    // give the magic-link email a valid https:// destination to redirect to, and to show the
    // user something other than a blank tab while that happens.
    setTimeout(function() {
      document.getElementById('heading').textContent = 'All set';
      document.getElementById('message').textContent = 'You can close this tab now.';
      document.querySelector('.spinner').style.display = 'none';
    }, 4000);
  </script>
</body>
</html>
