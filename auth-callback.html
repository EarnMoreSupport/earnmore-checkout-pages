<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in — EarnMore</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.5s ease-out; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #1a1a2e;
    background-image: radial-gradient(circle at 50% -10%, rgba(0, 212, 170, 0.16), transparent 55%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 400px;
    width: 100%;
    text-align: center;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 40px 32px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }
  .logo { height: 64px; margin-bottom: 24px; }
  .spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid rgba(0, 212, 170, 0.2);
    border-top-color: #00d4aa;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge {
    display: none;
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(0, 212, 170, 0.15);
    border: 1px solid rgba(0, 212, 170, 0.4);
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.65);
  }
  button {
    display: none;
    margin-top: 24px;
    background: rgba(0, 212, 170, 0.15);
    border: 1px solid rgba(0, 212, 170, 0.4);
    color: #00d4aa;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 28px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: rgba(0, 212, 170, 0.25); }
  button:active { transform: scale(0.98); }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>

  <script>
    // The extension's background script reads the access_token directly out of this page's URL
    // (via a tabs.onUpdated listener matching this exact URL, watching for the #access_token=
    // fragment) — nothing on this page hands anything off manually for that flow. This page only
    // exists to give the magic-link email a valid https:// destination to redirect to, and to
    // show the user something other than a blank tab while that happens.
    //
    // Native iOS/macOS has no extension background script watching tab URLs, so it needs an
    // actual handoff: if EarnMore is installed, this attempts a client-side redirect to
    // earnmore://authcallback with the same fragment. Supabase's own server-side redirect_to
    // has a known reliability issue for magic links when the target is a non-http(s) custom
    // scheme (falls back to the Site URL instead) — routing through this https:// page first,
    // then doing the scheme redirect client-side, sidesteps that entirely. On desktop browsers
    // with no app registered for earnmore://, this just silently no-ops and the extension flow
    // above proceeds exactly as before.
    if (window.location.hash.includes('access_token')) {
      window.location.href = 'earnmore://authcallback' + window.location.hash;
    }

    // Cross-device handoff: neither of the two mechanisms above helps if this link is opened on a
    // device/browser that has neither the extension nor the app installed — the token is real and
    // sitting right here in the URL, but nothing captures it. If the requesting client generated a
    // pickup nonce (folded into the magic link's redirect URL as ?p=..., which Supabase preserves
    // through the redirect alongside its own #access_token fragment), POST the session to the
    // magic-link-pickup Edge Function keyed by that nonce, regardless of what's installed here —
    // the requesting client is polling for it by the same nonce. A page loaded from an older email
    // (sent before this existed) simply has no ?p= param and skips this harmlessly.
    (function() {
      var hash = window.location.hash.replace(/^#/, '');
      var hashParams = {};
      hash.split('&').forEach(function(pair) {
        var idx = pair.indexOf('=');
        if (idx === -1) return;
        hashParams[pair.slice(0, idx)] = decodeURIComponent(pair.slice(idx + 1));
      });
      var nonce = new URLSearchParams(window.location.search).get('p');
      var accessToken = hashParams['access_token'];
      var refreshToken = hashParams['refresh_token'];
      var expiresIn = hashParams['expires_in'];
      if (!nonce || !accessToken || !refreshToken || !expiresIn) return;
      fetch('https://ongagzsmpexzfnmhggvs.supabase.co/functions/v1/magic-link-pickup', {

        headers: {
          'Content-Type': 'application/json',
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZ2FnenNtcGV4emZubWhnZ3ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwODk5MDQsImV4cCI6MjA5MDY2NTkwNH0.0LcoGf_00CgfKLZlqIaWmb0Riy27pGtv4cf29ANzCeo'

          nonce: nonce,
          access_token: accessToken,
          refresh_token: refreshToken,
          expires_in: parseInt(expiresIn, 10)

        // fallback for the Apple-to-Apple case regardless, so a failed store here (offline, ad
        // blocker, function not yet deployed) isn't the only path to a working sign-in.
      });
    })();

      document.getElementById('hint').style.display = 'block';
    }, 4000);
